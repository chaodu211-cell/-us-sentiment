name: margin

# FINRA 月频保证金统计 → raw/_margin.csv（研报 Fig 4 的口径：融资借方 − 两类贷方）。
#
# 为什么单独一条工作流、而不是塞进 daily：
#   · 数据是**月频**的，每天去抓 30 次只会拿到同一份，纯浪费；
#   · FINRA 的发布节奏是次月第 3~4 周，所以每月 25 号跑一次就够；
#   · 抓不到时不该影响每日页面——这里失败了，daily 照跑，页面上只是少一行读数。
#
# 为什么产物要提交进 git（raw/ 其余文件都不提交）：
#   raw/ 下所有别的文件都能随时重下，唯独这份不能——它是月频快照，
#   FINRA 只挂当期文件，漏了就补不回来。几 KB 一份，进 git 安全。
#   .gitignore 里为它开了例外。
on:
  schedule:
    - cron: "0 13 25 * *"     # 每月 25 日 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: margin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 不装 pandas —— fetch_margin.py 只用标准库

      - name: 抓 FINRA 保证金统计
        id: fetch
        run: |
          set -o pipefail
          python3 fetch_margin.py 2>&1 | tee margin.log

      # 抓取失败时把日志摊到运行摘要里，方便直接看出是"地址变了"还是"表结构变了"
      - name: 失败时贴出日志
        if: failure()
        run: |
          {
            echo "### FINRA 抓取失败"
            echo '```'
            tail -40 margin.log 2>/dev/null || echo "(没有日志)"
            echo '```'
            echo "退路：手工下载 https://www.finra.org/investors/insights/investing/margin-statistics 上的表，"
            echo "本地跑 \`python3 fetch_margin.py --file <下载到的文件>\`，把 raw/_margin.csv 提交上来即可。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交 raw/_margin.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/_margin.csv
          if git diff --cached --quiet; then
            echo "保证金数据无变化，跳过提交"
            exit 0
          fi
          LAST=$(head -1 raw/_margin.csv | cut -d, -f1)
          git commit -m "margin: FINRA 保证金统计更新至 $LAST"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push && break
            sleep $((i * 3))
          done

      - name: 运行摘要
        if: success()
        run: |
          {
            echo "### FINRA 保证金统计"
            echo '```'
            cat margin.log
            echo '```'
            echo "页面上的读数会在下一次 daily 运行（工作日 12:00 UTC）时更新——"
            echo "用 GITHUB_TOKEN 推的提交不会触发别的工作流，所以这里不会立刻重建页面。"
          } >> "$GITHUB_STEP_SUMMARY"
